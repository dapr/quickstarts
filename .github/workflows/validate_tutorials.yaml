name: Validate Tutorials

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - feature/new_quickstarts
      - release-*
    tags:
      - v*
  pull_request:
    branches:
      - master
      - feature/new_quickstarts
      - release-*
jobs:
  deploy:
    name: Validate tutorials on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Load environment variables
        uses: artursouza/export-env-action@v2
        with:
          envFile: './.github/env/global.env'
          expand: 'true'
      - name: Pinning Python to ${{ env.MACOS_PYTHON_VERSION }} on MacOS
        if: matrix.os == 'macos-latest'
        run: brew install python@${{ env.MACOS_PYTHON_VERSION }} && brew unlink python@${{ env.MACOS_PYTHON_VERSION }} && brew link --overwrite python@${{ env.MACOS_PYTHON_VERSION }}
      - name: Verify Python version
        run: python3 --version
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Show .Net version
        run: dotnet --version
      - name: Install Docker - MacOS
        if: matrix.os == 'macos-latest'
        uses: docker-practice/actions-setup-docker@v1
        with:
          docker_buildx: false
          docker_version: 20.10
      - name: Install Helm - MacOS
        if: matrix.os == 'macos-latest'
        run: brew install helm
      - name: Configure KinD
        if: matrix.os == 'ubuntu-latest'
        # Generate a KinD configuration file that uses:
        # A couple of worker nodes: this is needed to run both
        #     ZooKeeper + Kakfa
        working-directory: ./
        run: |
          cat > kind.yaml <<EOF
          apiVersion: kind.x-k8s.io/v1alpha4
          kind: Cluster
          nodes:
          - role: control-plane
            image: kindest/node:${{ env.KUBERNETES_VERSION }}@${{ env.KIND_IMAGE_SHA }}
          - role: worker
            image: kindest/node:${{ env.KUBERNETES_VERSION }}@${{ env.KIND_IMAGE_SHA }}
          - role: worker
            image: kindest/node:${{ env.KUBERNETES_VERSION }}@${{ env.KIND_IMAGE_SHA }}
          - role: worker
            image: kindest/node:${{ env.KUBERNETES_VERSION }}@${{ env.KIND_IMAGE_SHA }}
          - role: worker
            image: kindest/node:${{ env.KUBERNETES_VERSION }}@${{ env.KIND_IMAGE_SHA }}
          EOF

          # Log the generated kind.yaml for easy reference.
          cat kind.yaml

      - name: Create KinD Cluster - Linux
        if: matrix.os == 'ubuntu-latest'
        uses: helm/kind-action@v1.2.0
        with:
          config: kind.yaml
          cluster_name: kind
          version: ${{ env.KIND_VERSION }}
      - name: Install minikube - MacOS
        if: matrix.os == 'macos-latest'
        run: |
          brew install kubernetes-cli || brew link --overwrite kubernetes-cli
          brew install minikube
          minikube start --driver=virtualbox --memory 8192 --host-only-cidr "192.168.59.1/24"
      - name: Get KinD info
        if: matrix.os == 'ubuntu-latest'
        run: |
          kubectl cluster-info --context kind-kind
          NODE_IP=$(kubectl get nodes \
                    -lkubernetes.io/hostname!=kind-control-plane \
                    -ojsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')
          echo "SERVICE_IP=$NODE_IP" >> $GITHUB_ENV
      - name: Set up Go ${{ env.GOVER }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GOVER }}
          cache: false
      - name: Set up Dapr CLI - Mac/Linux
        if: matrix.os != 'windows-latest'
        run: wget -q ${{ env.DAPR_INSTALL_URL }}/install.sh -O - | /bin/bash -s ${{ env.DAPR_CLI_VERSION }}
      - name: Set up Dapr CLI - Windows
        if: matrix.os == 'windows-latest'
        run: powershell -Command "\$$script=iwr -useb ${{ env.DAPR_INSTALL_URL }}/install.ps1; \$$block=[ScriptBlock]::Create(\$$script); invoke-command -ScriptBlock \$$block -ArgumentList ${{ env.DAPR_CLI_VERSION }}"
      - name: Install Dapr
        run: |
          export GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          dapr init --runtime-version=${{ env.DAPR_RUNTIME_VERSION }}
          dapr --version
      - name: Install Dapr - Kubernetes
        run: |
          dapr init -k --dev --runtime-version=${{ env.DAPR_RUNTIME_VERSION }} --wait || kubectl get pods --all-namespaces
          kubectl get nodes -o wide
          kubectl describe pod dapr-dev-redis-master-0
          helm list
          for pod in `dapr status -k | awk '/dapr/ {print $1}'`; do kubectl describe pod -l app=$pod -n dapr-system ; kubectl logs -l app=$pod -n dapr-system; done
      - name: Install utilities dependencies
        run: |
          echo "PATH=$PATH:$HOME/.local/bin" >> $GITHUB_ENV
          uv tool install mechanical-markdown
      - name: Validate hello-world
        run: |
          pushd tutorials/hello-world
          make validate
          popd
      # - name: Validate hello-kubernetes multi app run
      #   if: matrix.os == 'ubuntu-latest'
      #   run: |
      #     pushd tutorials/hello-kubernetes
      #     make validate_multi_app_run
      #     popd
      - name: Validate hello-kubernetes normal run
        if: matrix.os == 'ubuntu-latest'
        run: |
          pushd tutorials/hello-kubernetes
          make validate_normal_run
          popd
      # - name: Validate distributed-calculator
      #   if: matrix.os == 'ubuntu-latest'
      #   run: |
      #     pushd tutorials/distributed-calculator
      #     make validate
      #     popd
      # - name: Validate pub-sub
      #   if: matrix.os == 'ubuntu-latest'
      #   run: |
      #     pushd tutorials/pub-sub
      #     make validate
      #     popd
      # - name: Validate bindings
      #   if: matrix.os == 'ubuntu-latest'
      #   run: |
      #     pushd tutorials/bindings
      #     make validate
      #     popd
      # - name: Validate secretstore
      #   if: matrix.os == 'ubuntu-latest'
      #   run: |
      #     pushd tutorials/secretstore
      #     make validate
      #     popd
      # - name: Validate observability
      #   if: matrix.os == 'ubuntu-latest'
      #   run: |
      #     pushd tutorials/observability
      #     make validate
      #     popd
      #- name: Linkcheck README.md
      #  run: |
      #    make validate

  # Validation of the workflow tutorials. Mechanical Markdown cannot drive their long-running
  # services, so tutorials/workflow/validate.sh starts each tutorial, sends the requests of its
  # .http file and checks every workflow instance through the Dapr workflow API.
  # The challenges-tips tutorials are excluded: they hold code snippets only and have nothing to run.
  workflow-tutorials:
    name: Workflow tutorial ${{ matrix.lang }}/${{ matrix.topic }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lang: python, topic: child-workflows }
          - { lang: python, topic: external-system-interaction }
          - { lang: python, topic: fan-out-fan-in }
          - { lang: python, topic: fundamentals }
          - { lang: python, topic: history-propagation }
          - { lang: python, topic: monitor-pattern }
          - { lang: python, topic: resiliency-and-compensation }
          - { lang: python, topic: task-chaining }
          - { lang: python, topic: versioning }
          - { lang: python, topic: workflow-management }
          - { lang: csharp, topic: child-workflows }
          - { lang: csharp, topic: external-system-interaction }
          - { lang: csharp, topic: fan-out-fan-in }
          - { lang: csharp, topic: fundamentals }
          - { lang: csharp, topic: history-propagation }
          - { lang: csharp, topic: monitor-pattern }
          - { lang: csharp, topic: resiliency-and-compensation }
          - { lang: csharp, topic: task-chaining }
          - { lang: csharp, topic: versioning }
          - { lang: csharp, topic: workflow-management }
          - { lang: go, topic: history-propagation }
          - { lang: java, topic: child-workflows }
          - { lang: java, topic: external-system-interactions }
          - { lang: java, topic: fan-out-fan-in }
          - { lang: java, topic: fundamentals }
          - { lang: java, topic: history-propagation }
          - { lang: java, topic: monitor-pattern }
          - { lang: java, topic: resiliency-and-compensation }
          - { lang: java, topic: task-chaining }
          - { lang: java, topic: versioning }
          - { lang: java, topic: workflow-management }
          - { lang: java, topic: combined-patterns }
          - { lang: javascript, topic: child-workflows }
          - { lang: javascript, topic: external-system-interaction }
          - { lang: javascript, topic: fan-out-fan-in }
          - { lang: javascript, topic: fundamentals }
          - { lang: javascript, topic: monitor-pattern }
          - { lang: javascript, topic: resiliency-and-compensation }
          - { lang: javascript, topic: task-chaining }
          - { lang: javascript, topic: versioning }
          - { lang: javascript, topic: workflow-management }
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Load environment variables
        uses: artursouza/export-env-action@v2
        with:
          envFile: './.github/env/global.env'
          expand: 'true'
      - name: Install uv
        if: matrix.lang == 'python'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install .NET
        if: matrix.lang == 'csharp'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Set up Go ${{ env.GOVER }}
        if: matrix.lang == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GOVER }}
          cache: false
      - name: Set up Node.js 24
        if: matrix.lang == 'javascript'
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Set up OpenJDK 17
        if: matrix.lang == 'java'
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Set up Dapr CLI
        run: wget -q ${{ env.DAPR_INSTALL_URL }}/install.sh -O - | /bin/bash -s ${{ env.DAPR_CLI_VERSION }}
      - name: Install the Dapr binaries
        # Java tutorials start Dapr with Testcontainers and need no local Dapr runtime.
        if: matrix.lang != 'java'
        run: |
          export GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          dapr init --slim --runtime-version=${{ env.DAPR_RUNTIME_VERSION }}
          dapr --version
      - name: Start the Scheduler and Placement services
        # The commands of "Run the tutorials without Docker" in the language README.
        if: matrix.lang != 'java'
        run: |
          mkdir -p "$RUNNER_TEMP/scheduler-data"
          nohup "$HOME/.dapr/bin/scheduler" --etcd-data-dir "$RUNNER_TEMP/scheduler-data" > "$RUNNER_TEMP/scheduler.log" 2>&1 &
          nohup "$HOME/.dapr/bin/placement" --healthz-port 8081 --metrics-port 9091 > "$RUNNER_TEMP/placement.log" 2>&1 &
          for port in 8080 8081; do
            curl --silent --fail --retry 30 --retry-connrefused --retry-delay 1 "http://localhost:$port/healthz" > /dev/null
          done
      - name: Validate workflow/${{ matrix.lang }}/${{ matrix.topic }}
        run: bash tutorials/workflow/validate.sh ${{ matrix.lang }} ${{ matrix.topic }}

  # combined-patterns uses Redis for pub/sub, so these topics run with a Redis service container.
  workflow-tutorials-redis:
    name: Workflow tutorial ${{ matrix.lang }}/${{ matrix.topic }} (Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lang: python, topic: combined-patterns }
          - { lang: csharp, topic: combined-patterns }
          - { lang: javascript, topic: combined-patterns }
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Load environment variables
        uses: artursouza/export-env-action@v2
        with:
          envFile: './.github/env/global.env'
          expand: 'true'
      - name: Install uv
        if: matrix.lang == 'python'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install .NET
        if: matrix.lang == 'csharp'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Set up Go ${{ env.GOVER }}
        if: matrix.lang == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GOVER }}
          cache: false
      - name: Set up Node.js 24
        if: matrix.lang == 'javascript'
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Set up OpenJDK 17
        if: matrix.lang == 'java'
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Set up Dapr CLI
        run: wget -q ${{ env.DAPR_INSTALL_URL }}/install.sh -O - | /bin/bash -s ${{ env.DAPR_CLI_VERSION }}
      - name: Install the Dapr binaries
        # Java tutorials start Dapr with Testcontainers and need no local Dapr runtime.
        if: matrix.lang != 'java'
        run: |
          export GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          dapr init --slim --runtime-version=${{ env.DAPR_RUNTIME_VERSION }}
          dapr --version
      - name: Start the Scheduler and Placement services
        # The commands of "Run the tutorials without Docker" in the language README.
        if: matrix.lang != 'java'
        run: |
          mkdir -p "$RUNNER_TEMP/scheduler-data"
          nohup "$HOME/.dapr/bin/scheduler" --etcd-data-dir "$RUNNER_TEMP/scheduler-data" > "$RUNNER_TEMP/scheduler.log" 2>&1 &
          nohup "$HOME/.dapr/bin/placement" --healthz-port 8081 --metrics-port 9091 > "$RUNNER_TEMP/placement.log" 2>&1 &
          for port in 8080 8081; do
            curl --silent --fail --retry 30 --retry-connrefused --retry-delay 1 "http://localhost:$port/healthz" > /dev/null
          done
      - name: Validate workflow/${{ matrix.lang }}/${{ matrix.topic }}
        run: bash tutorials/workflow/validate.sh ${{ matrix.lang }} ${{ matrix.topic }}
