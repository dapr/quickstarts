apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: localsecretstore
spec:
  type: secretstores.local.file
  version: v1
  metadata:
  # Relative to the directory daprd starts in: a quickstart's agent/ folder.
  - name: secretsFile
    value: ../../../secrets.json
  - name: nestedSeparator
    value: ":"
