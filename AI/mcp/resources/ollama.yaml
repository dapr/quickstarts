# Dapr Conversation API component — Ollama provider.
# DurableAgent calls into Dapr's Conversation API rather than calling an LLM
# directly, so a `conversation.*` component must be loaded for the agent to
# generate responses. Ollama runs locally — no API key required.
#
# Local prereq: `ollama serve` is running and `ollama pull llama3.2:latest`
# has been executed. CI uses `ai-action/setup-ollama@v2` to install Ollama
# and pulls the same model — see .github/workflows/validate_python_quickstarts.yaml.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: ollama
spec:
  type: conversation.ollama
  version: v1
  metadata:
    - name: model
      value: llama3.2:latest
