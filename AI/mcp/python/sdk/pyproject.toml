[project]
name = "mcp-quickstart-sdk"
version = "0.0.0"
description = "Dapr MCPServer quickstart — sdk variant (DaprMCPClient + workflows)"
requires-python = ">=3.11"
dependencies = [
    "dapr>=1.18.0rc0",
    "dapr-ext-workflow>=1.18.0rc0",
    "mcp>=1.26.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
