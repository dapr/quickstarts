[project]
name = "mcp-quickstart-servers"
version = "0.0.0"
description = "MCP servers (streamableHTTP, stdio, SSE) used by the MCP quickstart"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.26.0,<2.0.0",
    "uvicorn>=0.27.0",
    "starlette>=0.36.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Scripts, not a library — nothing to package as a wheel.
bypass-selection = true
