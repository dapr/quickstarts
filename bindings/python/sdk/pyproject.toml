[project]
name = "bindings-python-sdk"
version = "0"
description = "Dapr bindings quickstart (Python SDK)."
requires-python = ">=3.11"
dependencies = [
    "dapr>=1.19.0rc1",
    "Flask",
    "uvicorn",
    "typing-extensions",
    "werkzeug>=3.0.3",
]

[tool.uv]
package = false

[tool.uv.sources]
dapr = { git = "https://github.com/dapr/python-sdk", rev = "e49480ce8252cd05dd625fa4e0c67fa1c43be45f" }
