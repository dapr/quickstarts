apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub
spec:
  type: pubsub.amqp
  version: v1
  metadata:
  # Local ActiveMQ Artemis broker. Start it with:
  #   docker run -d -p 5672:5672 -p 8161:8161 \
  #     --env ARTEMIS_USER=artemis --env ARTEMIS_PASSWORD=artemis \
  #     --name artemis apache/activemq-artemis:latest
  - name: url
    value: amqp://localhost:5672
  - name: username
    value: artemis
  - name: password
    value: artemis
  # Artemis namespaces destinations by routing type: topics are multicast,
  # queues are anycast.
  - name: topicAddressPrefix
    value: multicast://
  - name: queueAddressPrefix
    value: anycast://
